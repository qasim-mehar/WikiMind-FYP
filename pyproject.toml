[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikimind"
version = "0.1.0"
description = "Compile source documents into a source-tracked, versioned knowledge graph."
readme = "README.dev.md"
# Ruling 20 extension: FakeEmbedder golden digests are interpreter-sensitive; 3.12+ shifts them by 1 ULP
requires-python = ">=3.11,<3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    # Ruling 20: parse golden digests are pypdf-sensitive (generated
    # under 6.x). Bumping to 7+ requires governed golden regeneration.
    "pypdf>=6.21.2,<7",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0"]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.4", "google-genai>=1.0", "fastapi>=0.100", "uvicorn>=0.27"]

[project.scripts]
wikimind = "wikimind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
